---
# RedHat-family OS overrides
profile::base::package_provider: dnf
profile::base::firewall_provider: firewalld
profile::base::extra_packages:
  - vim-enhanced
  - tmux
  - jq
  - chrony

profile::web::package_name: httpd
profile::web::service_name: httpd
profile::web::config_dir: /etc/httpd
profile::web::modules_dir: /etc/httpd/conf.modules.d
profile::web::ssl_package: mod_ssl

profile::database::package_name: postgresql-server
profile::database::service_name: postgresql
profile::database::data_dir: /var/lib/pgsql/data
profile::database::config_file: /var/lib/pgsql/data/postgresql.conf
profile::database::hba_file: /var/lib/pgsql/data/pg_hba.conf

profile::monitoring::node_exporter_package: golang-github-prometheus-node-exporter
