---
# roles/security — translated from profile::security
- name: Configure SELinux
  ansible.builtin.template:
    src: selinux_config.j2
    dest: /etc/selinux/config

- name: Set SELinux mode
  ansible.posix.selinux:
    policy: targeted
    state: "{{ selinux_mode }}"

- name: Deploy SSH hardening config
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/hardening.conf
  notify: restart sshd

- name: Enable and start sshd
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started

- name: Deploy password policy
  ansible.builtin.template:
    src: login.defs.j2
    dest: /etc/login.defs

- name: Install EPEL repository
  ansible.builtin.dnf:
    name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
    state: present
    disable_gpg_check: true

- name: Install fail2ban
  ansible.builtin.dnf:
    name: fail2ban
    state: present

- name: Deploy fail2ban config
  ansible.builtin.template:
    src: fail2ban_jail.local.j2
    dest: /etc/fail2ban/jail.local
  notify: restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
