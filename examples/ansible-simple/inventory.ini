[webservers]
# Update with current agent IP after provisioning
# 18.116.13.248

[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/xform-puppet-key

# AWS — values from secrets.yml (ansible-vault)
aws_access_key_id={{ vault_aws_access_key_id }}
