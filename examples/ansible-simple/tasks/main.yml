---
# tasks/main.yml — Ansible translation of puppet-simple/manifests/site.pp
#
# Puppet Resource                          → Ansible Equivalent
# ─────────────────────────────────────    ──────────────────────────
# package[httpd]                           → ansible.builtin.dnf
# package[firewalld]                       → ansible.builtin.dnf
# file[/var/www/html/index.html]           → ansible.builtin.template (notify handler)
# service[httpd]                           → ansible.builtin.systemd
# service[firewalld]                       → ansible.builtin.systemd
# exec[firewall-allow-http]               → ansible.posix.firewalld
# exec[firewall-allow-https]              → ansible.posix.firewalld
# exec[firewall-reload] (refreshonly)     → (eliminated — firewalld module reloads)

- name: Install httpd
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Deploy index.html from template
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: apache
    group: apache
    mode: "0644"
  notify: restart httpd

- name: Enable and start httpd
  ansible.builtin.systemd:
    name: httpd
    enabled: true
    state: started

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Allow HTTP through firewall
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled

- name: Allow HTTPS through firewall
  ansible.posix.firewalld:
    service: https
    permanent: true
    immediate: true
    state: enabled
