---
# teardown.yml — Destroy all AWS resources created by this project
- name: Tear down Puppet lab infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Find EC2 instances by project tag
      amazon.aws.ec2_instance_info:
        aws_access_key: "{{ aws_access_key_id }}"
        aws_secret_key: "{{ aws_secret_access_key }}"
        region: "{{ aws_region }}"
        filters:
          "tag:Project": "{{ project_tag }}"
          instance-state-name:
            - running
            - stopped
      register: ec2_instances

    - name: Terminate EC2 instances
      amazon.aws.ec2_instance:
        aws_access_key: "{{ aws_access_key_id }}"
        aws_secret_key: "{{ aws_secret_access_key }}"
        region: "{{ aws_region }}"
        instance_ids: "{{ ec2_instances.instances | map(attribute='instance_id') | list }}"
        state: absent
        wait: true
      when: ec2_instances.instances | length > 0

    - name: Remove DNS record
      amazon.aws.route53:
        aws_access_key: "{{ aws_access_key_id }}"
        aws_secret_key: "{{ aws_secret_access_key }}"
        zone: "{{ aws_route53_domain }}"
        hosted_zone_id: "{{ aws_route53_zone_id }}"
        record: "{{ puppet_master_fqdn }}"
        type: A
        state: absent
      ignore_errors: true

    - name: Remove key pair
      amazon.aws.ec2_key:
        aws_access_key: "{{ aws_access_key_id }}"
        aws_secret_key: "{{ aws_secret_access_key }}"
        region: "{{ aws_region }}"
        name: "{{ key_pair_name }}"
        state: absent

    - name: Find VPC
      amazon.aws.ec2_vpc_net_info:
        aws_access_key: "{{ aws_access_key_id }}"
        aws_secret_key: "{{ aws_secret_access_key }}"
        region: "{{ aws_region }}"
        filters:
          "tag:Project": "{{ project_tag }}"
      register: vpcs

    - name: Remove security group
      amazon.aws.ec2_security_group:
        aws_access_key: "{{ aws_access_key_id }}"
        aws_secret_key: "{{ aws_secret_access_key }}"
        region: "{{ aws_region }}"
        name: "{{ project_tag }}-sg"
        state: absent
      when: vpcs.vpcs | length > 0

    - name: Remove subnet
      amazon.aws.ec2_vpc_subnet:
        aws_access_key: "{{ aws_access_key_id }}"
        aws_secret_key: "{{ aws_secret_access_key }}"
        region: "{{ aws_region }}"
        vpc_id: "{{ vpcs.vpcs[0].id }}"
        cidr: "{{ subnet_cidr }}"
        state: absent
      when: vpcs.vpcs | length > 0

    - name: Remove internet gateway
      amazon.aws.ec2_vpc_igw:
        aws_access_key: "{{ aws_access_key_id }}"
        aws_secret_key: "{{ aws_secret_access_key }}"
        region: "{{ aws_region }}"
        vpc_id: "{{ vpcs.vpcs[0].id }}"
        state: absent
      when: vpcs.vpcs | length > 0

    - name: Remove route table
      amazon.aws.ec2_vpc_route_table:
        aws_access_key: "{{ aws_access_key_id }}"
        aws_secret_key: "{{ aws_secret_access_key }}"
        region: "{{ aws_region }}"
        vpc_id: "{{ vpcs.vpcs[0].id }}"
        tags:
          Name: "{{ project_tag }}-rt"
        lookup: tag
        state: absent
      when: vpcs.vpcs | length > 0

    - name: Remove VPC
      amazon.aws.ec2_vpc_net:
        aws_access_key: "{{ aws_access_key_id }}"
        aws_secret_key: "{{ aws_secret_access_key }}"
        region: "{{ aws_region }}"
        name: "{{ project_tag }}-vpc"
        cidr_block: "{{ vpc_cidr }}"
        state: absent
      when: vpcs.vpcs | length > 0

    - name: Infrastructure teardown complete
      ansible.builtin.debug:
        msg: "All AWS resources for {{ project_tag }} have been destroyed."
