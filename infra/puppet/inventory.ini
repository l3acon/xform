[puppet_master]

[puppet_agents]

[puppet:children]
puppet_master
puppet_agents

[all:vars]
# AWS Configuration — values from secrets.yml (ansible-vault)
aws_access_key_id={{ vault_aws_access_key_id }}
aws_secret_access_key={{ vault_aws_secret_access_key }}
aws_region={{ vault_aws_region }}
aws_route53_zone_id={{ vault_aws_route53_zone_id }}
aws_route53_domain={{ vault_aws_route53_domain }}

# Project
project_tag=xform-puppet

# Networking
vpc_cidr=10.0.0.0/16
subnet_cidr=10.0.1.0/24
availability_zone=us-east-2a

# EC2 Instances
key_pair_name=xform-puppet-key
puppet_master_instance_type=t3.medium
puppet_agent_instance_type=t3.small
rhel9_ami_owner=309956199498
rhel9_ami_name_filter=RHEL-9.*_HVM-*-x86_64-*-Hourly2-GP3

# Puppet Configuration
puppet_master_hostname=puppet
puppet_master_fqdn=puppet.{{ vault_aws_route53_domain }}
puppet_version=8
puppet_agent_count=1
